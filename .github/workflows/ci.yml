
name: Farmer Marketplace CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Run project tests
        run: node tests/check.js

      - name: Build Docker image
        run: docker build -t farmer-marketplace .

  publish-image:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
         
          tags: |
            ghcr.io/${{ steps.image-name.outputs.owner }}/farmer-marketplace:latest
            ghcr.io/${{ steps.image-name.outputs.owner }}/farmer-marketplace:${{ github.sha }}

        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
